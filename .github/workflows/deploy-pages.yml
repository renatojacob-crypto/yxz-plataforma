name: Deploy YXZ Plataforma - GitHub Pages


on:

  # Durante a fase de testes publicaremos a branch
  # feature/layout-portal.
  push:
    branches:
      - feature/layout-portal

  # Também permite executar manualmente.
  workflow_dispatch:


permissions:
  contents: read
  pages: write
  id-token: write


concurrency:
  group: github-pages
  cancel-in-progress: true


jobs:

  deploy:

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}


    runs-on: ubuntu-latest


    steps:

      - name: Checkout
        uses: actions/checkout@v7


      - name: Configurar Node
        uses: actions/setup-node@v7

        with:
          node-version: "lts/*"
          cache: npm


      - name: Instalar dependências
        run: npm ci


      - name: Gerar build da Plataforma YXZ
        run: npm run build

        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}


      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6


      - name: Enviar build
        uses: actions/upload-pages-artifact@v5

        with:
          path: ./dist


      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
