<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="robots"
    content="noindex, follow"
  >

  <meta
    name="theme-color"
    content="#0f2c25"
  >

  <title>
    Solicitação recebida | YXZ Soluções Educacionais
  </title>

  <link
    rel="icon"
    href="/assets/favicon.png"
    type="image/png"
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@600;700;800&family=Open+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >
</head>


<body class="public-thanks-body">

  <main class="public-thanks-page">

    <section
      class="public-thanks-card"
      aria-labelledby="thanks-title"
      aria-describedby="thanks-message"
    >

      <img
        src="/assets/yxz-robotic-logo-white.png"
        alt="YXZ Soluções Educacionais"
        width="240"
        height="98"
      >


      <span class="public-section-kicker">
        Solicitação enviada
      </span>


      <h1 id="thanks-title">
        Recebemos seu contato.
      </h1>


      <p id="thanks-message">
        Obrigado pelo interesse nas soluções
        educacionais da YXZ. As informações foram
        recebidas e poderão ser analisadas pela
        nossa equipe para os próximos passos
        da proposta.
      </p>


      <a
        class="site-btn site-btn-primary"
        href="/"
      >
        Voltar ao site
      </a>

    </section>

  </main>


  <script
    type="module"
    src="/src/public.js"
  ></script>

</body>

</html>
